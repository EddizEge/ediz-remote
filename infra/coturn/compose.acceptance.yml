services:
  coturn:
    image: coturn/coturn:4.17.0-r0-alpine@sha256:8f80ed9d6867319340ca612b9d005aaea2444755aa4ce3dd79ddfb5f31f6e1b5
    container_name: ediz-remote-coturn-acceptance
    entrypoint: ["/bin/sh", "/etc/ediz-remote/entrypoint.sh"]
    environment:
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?TURN_SHARED_SECRET is required}
      TURN_REALM: relay.local
      TURN_TEST_MODE: "true"
      TURN_ALLOW_PRIVATE_PEERS: "true"
      TURN_LOG_LEVEL: info
      TURN_LOG_OUTPUT: discard
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-127.0.0.1}
      TURN_RELAY_IP: "0.0.0.0"
      TURN_MIN_PORT: ${TURN_MIN_PORT:-49160}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-49200}
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}:${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}/udp"
    volumes:
      - ./entrypoint.sh:/etc/ediz-remote/entrypoint.sh:ro
    tmpfs:
      - /tmp:size=4m,mode=0700,uid=65534,gid=65534
      - /var/lib/coturn:size=16m,mode=0700,uid=65534,gid=65534
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "-p", "3478", "127.0.0.1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: "none"
