# Windows masaüstü paketini GitHub'ın barındırılan runner'ında derler, SLSA
# build provenance attestation'ı (Sigstore) üretir ve taslak GitHub Release açar.
# Authenticode imzası bu akışta yoktur; mevcut sign/verify kapısı ayrı kalır.
# Ayrıntı: docs/WINDOWS_RELEASE.md.
name: windows-release

on:
  workflow_dispatch:
    inputs:
      sequence:
        description: "Anti-rollback sequence (önceki yayın + 1; 1-65535)"
        required: true
        type: string

permissions: {}

concurrency:
  group: windows-release
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  RELEASE_REPOSITORY: EddizEge/ediz-remote
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    name: build
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      node-version: ${{ steps.toolchain.outputs.node-version }}
      npm-version: ${{ steps.toolchain.outputs.npm-version }}
      dotnet-version: ${{ steps.toolchain.outputs.dotnet-version }}
      runner-image: ${{ steps.toolchain.outputs.runner-image }}
    steps:
      - name: Girdiyi ve dalı doğrula
        env:
          RELEASE_SEQUENCE: ${{ inputs.sequence }}
        run: |
          if ($env:GITHUB_REPOSITORY -cne $env:RELEASE_REPOSITORY) {
            throw 'Yalnız ana depoda çalışır.'
          }
          if ($env:GITHUB_REF -cne 'refs/heads/main') {
            throw 'Yalnız refs/heads/main üzerinden çalışır.'
          }
          if ($env:RELEASE_SEQUENCE -cnotmatch '^[1-9][0-9]{0,8}$' -or
              [int]$env:RELEASE_SEQUENCE -gt 65535) {
            throw 'sequence 1-65535 arası, başında sıfır olmayan bir tamsayı olmalı.'
          }

      - name: Kaynağı al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Commit'i doğrula
        run: |
          $head = (git rev-parse --verify 'HEAD^{commit}').Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) {
            throw 'Checkout edilen commit tetiklenen commit değil.'
          }

      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: npm ci
        run: npm ci

      - name: npm test
        run: npm test

      - name: npm run lint
        run: npm run lint

      - name: npm run build
        run: npm run build

      - name: npm run native:test
        run: npm run native:test

      - name: npm run desktop:test
        run: npm run desktop:test

      - name: npm run release:windows:test
        run: npm run release:windows:test

      - name: npm run security:audit
        run: npm run security:audit

      - name: Araç sürümlerini kaydet
        id: toolchain
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $values = [ordered]@{
            'node-version' = ((node --version) | Out-String).Trim()
            'npm-version' = ((npm --version) | Out-String).Trim()
            'dotnet-version' = ((& '.tools/dotnet/dotnet.exe' --version) | Out-String).Trim()
            'runner-image' = '{0} {1}' -f $env:ImageOS, $env:ImageVersion
          }
          foreach ($entry in $values.GetEnumerator()) {
            if ($entry.Value -cnotmatch '^[A-Za-z0-9.+ -]{1,64}$') {
              throw "Beklenmeyen araç sürümü biçimi: $($entry.Key)"
            }
            "$($entry.Key)=$($entry.Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "$($entry.Key): $($entry.Value)"
          }

      - name: Kaynak ağacının temiz olduğunu doğrula
        run: |
          $changes = @(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)
          if ($LASTEXITCODE -ne 0) { throw 'git status okunamadı.' }
          if ($changes.Count -ne 0) {
            $changes | ForEach-Object { Write-Host $_ }
            throw 'Testler/build sonrası kaynak ağacı kirli; publish yapılmaz.'
          }

      - name: npm run desktop:publish
        env:
          EDIZ_REMOTE_RELEASE_SEQUENCE: ${{ inputs.sequence }}
        run: npm run desktop:publish

      - name: npm run release:windows:provenance
        env:
          EDIZ_REMOTE_RELEASE_MINIMUM_SEQUENCE: ${{ inputs.sequence }}
        run: npm run release:windows:provenance

      - name: Paket düzenini doğrula
        run: |
          $root = 'artifacts/windows-desktop'
          $expected = @(
            'EdizRemote.win-x64.provenance.json',
            'EdizRemote.win-x64.SHA256SUMS',
            'win-x64'
          )
          $actual = @(Get-ChildItem -LiteralPath $root -Force | ForEach-Object Name | Sort-Object)
          if ((Compare-Object $expected $actual -CaseSensitive).Count -ne 0) {
            throw 'artifacts/windows-desktop beklenen üç girdiyi içermiyor.'
          }
          if (-not (Test-Path -LiteralPath "$root/win-x64/EdizRemote.exe" -PathType Leaf)) {
            throw 'EdizRemote.exe bulunamadı.'
          }

      - name: Paketi yükle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-desktop-win-x64
          path: artifacts/windows-desktop/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  release:
    name: release
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    environment: windows-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_REPO: ${{ github.repository }}
      INPUT_DIR: release-input
      ASSET_DIR: release-assets
    steps:
      - name: Girdiyi ve dalı doğrula
        env:
          RELEASE_SEQUENCE: ${{ inputs.sequence }}
        run: |
          if ($env:GITHUB_REPOSITORY -cne $env:RELEASE_REPOSITORY) {
            throw 'Yalnız ana depoda çalışır.'
          }
          if ($env:GITHUB_REF -cne 'refs/heads/main') {
            throw 'Yalnız refs/heads/main üzerinden çalışır.'
          }
          if ($env:RELEASE_SEQUENCE -cnotmatch '^[1-9][0-9]{0,8}$' -or
              [int]$env:RELEASE_SEQUENCE -gt 65535) {
            throw 'sequence 1-65535 arası, başında sıfır olmayan bir tamsayı olmalı.'
          }

      - name: Paketi indir
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-desktop-win-x64
          path: release-input

      # npm/node çalıştırılmaz; yalnız PowerShell ve .NET.
      - name: Hash'leri SHA256SUMS'a karşı yeniden doğrula
        run: |
          $base = [IO.Path]::GetFullPath($env:INPUT_DIR)
          $expectedTop = @(
            'EdizRemote.win-x64.provenance.json',
            'EdizRemote.win-x64.SHA256SUMS',
            'win-x64'
          )
          $actualTop = @(Get-ChildItem -LiteralPath $base -Force | ForEach-Object Name | Sort-Object)
          if ((Compare-Object $expectedTop $actualTop -CaseSensitive).Count -ne 0) {
            throw 'İndirilen paketin üst düzeyi beklenen üç girdi değil.'
          }
          $treeRoot = Join-Path $base 'win-x64'
          $items = @(Get-ChildItem -LiteralPath $treeRoot -Recurse -Force)
          if (@($items | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint }).Count -ne 0) {
            throw 'Pakette reparse point var.'
          }
          $files = @{}
          foreach ($file in @($items | Where-Object { -not $_.PSIsContainer })) {
            $relative = 'win-x64/' + [IO.Path]::GetRelativePath($treeRoot, $file.FullName).Replace('\', '/')
            $files[$relative] = $file.FullName
          }

          $sumsPath = Join-Path $base 'EdizRemote.win-x64.SHA256SUMS'
          $lines = @([IO.File]::ReadAllText($sumsPath, [Text.UTF8Encoding]::new($false, $true)) -split '\r?\n')
          if ($lines[-1] -eq '') { $lines = @($lines | Select-Object -SkipLast 1) }
          if ($lines.Count -eq 0) { throw 'SHA256SUMS boş.' }
          $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($line in $lines) {
            if ($line -cnotmatch '^(?<hash>[0-9A-Fa-f]{64})  (?<path>win-x64/[^\x00-\x1f\\:*?"<>|]+)$') {
              throw 'SHA256SUMS satırı geçersiz.'
            }
            $path = $Matches['path']
            $expectedHash = $Matches['hash']
            $segments = $path.Split('/')
            if (@($segments | Where-Object { $_ -eq '' -or $_ -eq '.' -or $_ -eq '..' }).Count -ne 0) {
              throw 'SHA256SUMS güvenli olmayan yol içeriyor.'
            }
            if (-not $seen.Add($path)) { throw 'SHA256SUMS yinelenen yol içeriyor.' }
            if (-not $files.ContainsKey($path)) { throw "Pakette eksik dosya: $path" }
            $actualHash = (Get-FileHash -LiteralPath $files[$path] -Algorithm SHA256).Hash
            if (-not [string]::Equals($actualHash, $expectedHash, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Hash uyuşmuyor: $path"
            }
          }
          foreach ($path in $files.Keys) {
            if (-not $seen.Contains($path)) { throw "SHA256SUMS dışında dosya: $path" }
          }
          if (-not $seen.Contains('win-x64/EdizRemote.exe')) {
            throw 'SHA256SUMS EdizRemote.exe içermiyor.'
          }
          Write-Host "SHA256SUMS doğrulandı: $($seen.Count) dosya."

      # Repo kodu burada çalıştırılmaz; package.json yalnız veri olarak okunur.
      # verify-provenance betiği attestation'dan sonra çalışır.
      - name: Kaynağı al (betikler için)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false

      - name: Sürüm kimliği ve anti-rollback
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SEQUENCE: ${{ inputs.sequence }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $head = (git -C source rev-parse --verify 'HEAD^{commit}').Trim()
          if ($head -cne $env:GITHUB_SHA) { throw 'Checkout edilen commit tetiklenen commit değil.' }

          $package = Get-Content -LiteralPath 'source/package.json' -Raw | ConvertFrom-Json
          $version = [string]$package.version
          if ($version -cnotmatch '^(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})$') {
            throw 'package.json sürümü geçersiz.'
          }
          $sequence = [int]$env:RELEASE_SEQUENCE

          # EXE'nin gömülü kimliği bu koşunun commit'i ve girdisiyle aynı olmalı.
          $exe = Join-Path $env:INPUT_DIR 'win-x64/EdizRemote.exe'
          $info = [Diagnostics.FileVersionInfo]::GetVersionInfo([IO.Path]::GetFullPath($exe))
          if ($info.ProductVersion -cne "$version+$env:GITHUB_SHA") {
            throw 'EXE ProductVersion bu commit ile eşleşmiyor.'
          }
          if ($info.FileVersion -cne "$version.$sequence") {
            throw 'EXE FileVersion sürüm/sequence ile eşleşmiyor.'
          }

          # Taslaklar dahil bütün sürümler ve tag'ler; sequence bütün sürümlerde artar.
          $names = [Collections.Generic.List[string]]::new()
          $releaseJson = gh release list --limit 1000 --json tagName | Out-String
          foreach ($release in @($releaseJson | ConvertFrom-Json)) { $names.Add([string]$release.tagName) }
          $tagLines = @(gh api --paginate "repos/$env:GH_REPO/tags?per_page=100" --jq '.[].name')
          foreach ($tagName in $tagLines) { $names.Add([string]$tagName) }

          $tag = "windows-v$version.$sequence"
          $highest = 0
          foreach ($name in $names) {
            if ($name -ceq $tag) { throw "Tag ya da sürüm zaten var: $tag" }
            if ($name -cmatch '^windows-v[0-9]+\.[0-9]+\.[0-9]+\.(?<seq>[0-9]{1,9})$') {
              $highest = [Math]::Max($highest, [int]$Matches['seq'])
            }
          }
          if ($sequence -le $highest) {
            throw "Anti-rollback: sequence $sequence mevcut en yüksek $highest değerinden büyük değil."
          }
          Write-Host "Tag: $tag (önceki en yüksek sequence: $highest)"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Tam paketi zip'le
        run: |
          $inputDir = [IO.Path]::GetFullPath($env:INPUT_DIR)
          $assetDir = [IO.Path]::GetFullPath($env:ASSET_DIR)
          New-Item -ItemType Directory -Path $assetDir | Out-Null
          $zip = Join-Path $assetDir 'EdizRemote.win-x64.zip'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory(
            (Join-Path $inputDir 'win-x64'), $zip,
            [IO.Compression.CompressionLevel]::Optimal, $true)

          # Zip içeriği SHA256SUMS ile birebir aynı olmalı.
          $check = Join-Path $env:RUNNER_TEMP 'zip-check'
          [IO.Compression.ZipFile]::ExtractToDirectory($zip, $check)
          $sums = Get-Content -LiteralPath (Join-Path $inputDir 'EdizRemote.win-x64.SHA256SUMS')
          $expected = @($sums | Where-Object { $_ -ne '' })
          $extracted = @(Get-ChildItem -LiteralPath $check -Recurse -Force -File)
          if ($extracted.Count -ne $expected.Count) { throw 'Zip dosya sayısı SHA256SUMS ile uyuşmuyor.' }
          foreach ($line in $expected) {
            $hash, $path = $line -split '  ', 2
            $actual = (Get-FileHash -LiteralPath (Join-Path $check $path) -Algorithm SHA256).Hash
            if (-not [string]::Equals($actual, $hash, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Zip içinde hash uyuşmuyor: $path"
            }
          }
          Remove-Item -LiteralPath $check -Recurse -Force
          Write-Host "Zip doğrulandı: $($expected.Count) dosya."

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-input/win-x64/EdizRemote.exe
            release-input/EdizRemote.win-x64.provenance.json
            release-input/EdizRemote.win-x64.SHA256SUMS
            release-assets/EdizRemote.win-x64.zip

      - name: verify-provenance
        env:
          GH_TOKEN: ${{ github.token }}
          EDIZ_REMOTE_RELEASE_MINIMUM_SEQUENCE: ${{ inputs.sequence }}
        run: |
          $target = 'source/artifacts/windows-desktop'
          New-Item -ItemType Directory -Path $target | Out-Null
          Get-ChildItem -LiteralPath $env:INPUT_DIR -Force |
            Copy-Item -Destination $target -Recurse -Force
          Set-Location source
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows-release.ps1 verify-provenance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Taslak GitHub Release oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SEQUENCE: ${{ inputs.sequence }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          NODE_VERSION: ${{ needs.build.outputs.node-version }}
          NPM_VERSION: ${{ needs.build.outputs.npm-version }}
          DOTNET_VERSION: ${{ needs.build.outputs.dotnet-version }}
          RUNNER_IMAGE: ${{ needs.build.outputs.runner-image }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $assets = @(
            (Join-Path $env:INPUT_DIR 'win-x64/EdizRemote.exe'),
            (Join-Path $env:ASSET_DIR 'EdizRemote.win-x64.zip'),
            (Join-Path $env:INPUT_DIR 'EdizRemote.win-x64.provenance.json'),
            (Join-Path $env:INPUT_DIR 'EdizRemote.win-x64.SHA256SUMS')
          )
          $hashRows = foreach ($asset in $assets) {
            '| `{0}` | `{1}` |' -f (Split-Path -Leaf $asset),
              (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $verify = 'gh attestation verify <dosya> --repo {0} --signer-workflow {0}/.github/workflows/windows-release.yml --source-ref refs/heads/main --source-digest {1} --deny-self-hosted-runners' -f
            $env:RELEASE_REPOSITORY, $env:GITHUB_SHA
          $notes = @(
            "Ediz Remote Windows $env:RELEASE_VERSION (sequence $env:RELEASE_SEQUENCE)",
            '',
            "- Commit: ``$env:GITHUB_SHA``",
            "- Sequence: ``$env:RELEASE_SEQUENCE``",
            "- Build: GitHub Actions koşusu $env:GITHUB_RUN_ID ($env:RUNNER_IMAGE; Node $env:NODE_VERSION, npm $env:NPM_VERSION, .NET SDK $env:DOTNET_VERSION)",
            '- Authenticode imzası yok: ilk çalıştırmada SmartScreen uyarısı beklenir.',
            '  Bütünlük ve kaynak GitHub artifact attestation (Sigstore, SLSA build provenance) ile doğrulanır.',
            '',
            '| Dosya | SHA-256 |',
            '|---|---|'
          ) + $hashRows + @(
            '',
            'Doğrulama (EXE, zip, provenance.json ve SHA256SUMS için ayrı ayrı):',
            '',
            '```',
            $verify,
            '```',
            '',
            'Zip açıldıktan sonra `win-x64/` ağacı `EdizRemote.win-x64.SHA256SUMS` ile birebir eşleşmelidir.'
          )
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [IO.File]::WriteAllLines($notesPath, [string[]]$notes, [Text.UTF8Encoding]::new($false))

          # Concurrency tek koşuya izin verir; yine de son anda tag'i tekrar denetle.
          $existing = @(gh release list --limit 1000 --json tagName --jq '.[].tagName') +
            @(gh api --paginate "repos/$env:GH_REPO/tags?per_page=100" --jq '.[].name')
          if ($existing -ccontains $env:RELEASE_TAG) { throw "Tag ya da sürüm zaten var: $env:RELEASE_TAG" }

          gh release create $env:RELEASE_TAG --draft --target $env:GITHUB_SHA `
            --title "Ediz Remote Windows $env:RELEASE_VERSION (sequence $env:RELEASE_SEQUENCE)" `
            --notes-file $notesPath @assets
          Write-Host "Taslak sürüm oluşturuldu: $env:RELEASE_TAG"
